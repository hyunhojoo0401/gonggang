/* 레이아웃: 휴대폰 화면 한 장 = 앱 한 장. 위는 내용(스크롤), 아래는 버튼 영역(고정). PC에서는 가운데 휴대폰 크기 카드로 보인다. */
:root {
  /* 색: PC 프로그램과 같은 팬톤 그린 6가지에서 만든 색 */
  --page: #E8ECE4;        /* PC에서 앱 바깥 */
  --bg: #FFFFFF;          /* 앱 바탕 */
  --text: #1C3228;
  --sub: #506B58;         /* Myrtle */
  --hint: #5B7763;        /* Dark Ivy */
  --tag: #5B7961;         /* Comfrey */
  --primary: #3E6F58;     /* Foliage Green */
  --primary-press: #325946;
  --primary-text: #3E6F58;
  --on-primary: #FFFFFF;
  --selected: #506B58;
  --seg-bg: #E8ECE4;
  --chip-bg: #FFFFFF;
  --border: #BCCAB3;      /* Bok Choy */
  --line: #BCCAB3;
  --accent: #7A9B77;      /* Mineral Green */
  --ring-bg: #E4EAE1;
  --card: #EEF2EC;
  --card-line: #DEE4D9;
  --list-bg: #F7F9F6;
  --info-bg: #E4EAE1;
  --info-text: #1C3228;
  --alert-bg: #3E6F58;
  --alert-text: #FFFFFF;
  --focus: #7A9B77;
  --shadow: 0 18px 50px rgba(28, 50, 40, .16);
  /* 글꼴 */
  --font: "NanumSquareRound Web", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  /* 크기 */
  --gap: clamp(14px, 2.3vh, 26px);
  --row: clamp(46px, 6.6vh, 66px);
  --ring: min(62vw, 31vh, 250px);
  --radius: 14px;
}
@supports (height: 1dvh) {
  :root { --gap: clamp(14px, 2.3dvh, 26px); --row: clamp(46px, 6.6dvh, 66px); --ring: min(62vw, 31dvh, 250px); }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0A110D; --bg: #111A15; --text: #E4EDE6; --sub: #A9BFB0; --hint: #93AA9A; --tag: #A3BDA9;
    --primary: #44795F; --primary-press: #3A6852; --primary-text: #8DB08A; --on-primary: #FFFFFF; --selected: #5B7961;
    --seg-bg: #1C2721; --chip-bg: #16201A; --border: #34463B; --line: #3D5145; --accent: #8DB08A; --ring-bg: #24312A;
    --card: #1B2620; --card-line: #2B3A31; --list-bg: #16201A; --info-bg: #22312A; --info-text: #E4EDE6;
    --alert-bg: #3E6F58; --alert-text: #FFFFFF; --focus: #8DB08A; --shadow: 0 18px 50px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0A110D; --bg: #111A15; --text: #E4EDE6; --sub: #A9BFB0; --hint: #93AA9A; --tag: #A3BDA9;
  --primary: #44795F; --primary-press: #3A6852; --primary-text: #8DB08A; --on-primary: #FFFFFF; --selected: #5B7961;
  --seg-bg: #1C2721; --chip-bg: #16201A; --border: #34463B; --line: #3D5145; --accent: #8DB08A; --ring-bg: #24312A;
  --card: #1B2620; --card-line: #2B3A31; --list-bg: #16201A; --info-bg: #22312A; --info-text: #E4EDE6;
  --alert-bg: #3E6F58; --alert-text: #FFFFFF; --focus: #8DB08A; --shadow: 0 18px 50px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--page); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow: hidden;
  word-break: keep-all; overflow-wrap: anywhere;
}
p, span, strong { text-wrap: pretty; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.app {
  height: 100%; max-width: 460px; margin: 0 auto; background: var(--bg); position: relative; overflow: hidden;
}
@media (min-width: 640px) and (min-height: 700px) {
  body { display: grid; place-items: center; }
  .app { width: 420px; height: min(860px, calc(100% - 48px)); border-radius: 28px; box-shadow: var(--shadow); }
}
.screen { height: 100%; display: flex; flex-direction: column; }
.screen[hidden] { display: none !important; }
.screen-body {
  flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: var(--gap);
  padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px));
  padding-block: clamp(20px, 3.4dvh, 34px) 18px;
}
.screen-foot {
  flex: 0 0 auto; display: flex; flex-direction: column; gap: 10px; position: relative; background: var(--bg);
  padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px));
  padding-block: 12px 16px;
}
.screen-foot::before {
  content: ""; position: absolute; left: 0; right: 0; top: -18px; height: 18px; pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--bg));
}
.enter { animation: enter .28s ease-out; }
@keyframes enter { from { opacity: .35; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .enter { animation: none; } .ring-arc { transition: none !important; } }

/* 글자 */
.title { font-size: clamp(24px, 6.8vw, 28px); font-weight: 700; line-height: 1.2; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.subtitle { font-size: 14.5px; color: var(--sub); margin: 5px 0 0; }
.note { font-size: 12.5px; color: var(--hint); margin: 3px 0 0; }
.label { font-size: 14.5px; font-weight: 700; color: var(--sub); margin: 0 0 7px; display: block; }
.hint { font-size: 12.5px; color: var(--hint); margin: 7px 0 0; line-height: 1.5; }
.foot-note { font-size: 11.5px; color: var(--hint); margin: 0; text-align: center; line-height: 1.5; text-wrap: balance; }
.error { font-size: 14px; font-weight: 700; color: var(--primary-text); margin: 0; text-align: center; }
.error:empty { display: none; }
.credit { margin-top: auto; padding-top: 6px; }
.head-group { display: flex; flex-direction: column; }
.back { align-self: flex-start; background: none; border: 0; padding: 6px 0; margin: -6px 0 6px; font-size: 14px; font-weight: 700; color: var(--sub); }

/* 선택 막대 (캠퍼스 · 걸음 속도) */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--seg-bg); border-radius: 13px; }
.seg button {
  min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--sub); font-size: 15px;
  padding: 6px 4px; line-height: 1.2; transition: background .15s;
}
.seg button[aria-checked="true"] { background: var(--selected); color: var(--on-primary); font-weight: 700; }

/* 입력 칸 */
.field {
  width: 100%; min-height: 50px; border: 1.5px solid var(--border); border-radius: 12px; background: var(--bg);
  font-size: 17px; padding: 0 16px; color: var(--text);
}
select.field { appearance: none; -webkit-appearance: none; padding-right: 44px; }
.select-wrap { position: relative; }
.select-wrap::after {
  content: ""; position: absolute; right: 19px; top: 50%; width: 8px; height: 8px; pointer-events: none;
  border-right: 2px solid var(--sub); border-bottom: 2px solid var(--sub); transform: translateY(-70%) rotate(45deg);
}
select.field:invalid { color: var(--hint); }
.field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
.minutes { display: flex; align-items: center; gap: 8px; }
.minutes input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 17px; height: 47px; padding: 0; outline: none; color: var(--text); }
.minutes span { color: var(--sub); }
.minutes:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
.chips button {
  min-height: 36px; padding: 0 13px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--chip-bg);
  color: var(--sub); font-size: 14.5px;
}
.chips button[aria-pressed="true"] { background: var(--selected); border-color: var(--selected); color: var(--on-primary); font-weight: 700; }

/* 버튼 */
.btn {
  width: 100%; min-height: 56px; border-radius: var(--radius); border: 0; background: var(--primary); color: var(--on-primary);
  font-size: 17px; font-weight: 700; transition: background .15s, transform .08s;
}
.btn:active { background: var(--primary-press); transform: scale(.99); }
.btn[disabled] { opacity: .7; }
.btn-outline { min-height: 50px; background: var(--bg); color: var(--primary-text); border: 1.5px solid var(--primary-text); font-size: 16px; }
.btn-outline:active { background: var(--list-bg); }
.btn-outline .count { font-variant-numeric: tabular-nums; margin-left: 10px; }

/* 경로 목록 */
.timeline { list-style: none; margin: 0; padding: 8px 18px; background: var(--list-bg); border: 1px solid var(--card-line); border-radius: 16px; position: relative; }
.timeline::before {
  content: ""; position: absolute; left: 30px; width: 2px; background: var(--line);
  top: calc(8px + var(--row) / 2); bottom: calc(8px + var(--row) / 2);
}
.timeline.many { --row: clamp(38px, 5.2dvh, 46px); }
.tl-row { min-height: var(--row); display: flex; align-items: center; gap: 12px; position: relative; }
.tl-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--list-bg); flex: 0 0 auto; position: relative; z-index: 1; }
.tl-row.edge .tl-dot { width: 15px; height: 15px; margin-left: -1.5px; margin-right: -1.5px; background: var(--primary); border-color: var(--primary); }
.tl-name { font-size: 17px; flex: 1 1 auto; min-width: 0; }
.tl-row.edge .tl-name { font-weight: 700; }
.tl-tag { font-size: 12px; font-weight: 700; color: var(--tag); margin-left: 6px; white-space: nowrap; }
.tl-time { font-size: 15px; color: var(--sub); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tl-row:first-child .tl-time { color: var(--primary-text); font-weight: 700; font-size: 14px; }
.tl-row.last .tl-time { color: var(--text); font-weight: 700; }

/* 숫자 카드 · 안내 상자 */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { background: var(--card); border-radius: 14px; padding: 14px 16px 12px; min-width: 0; }
.stat-label { font-size: 13px; color: var(--sub); }
.stat-value { font-size: clamp(25px, 7.4vw, 30px); font-weight: 700; margin-top: 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.box { border-radius: 14px; padding: 14px 16px; background: var(--list-bg); border: 1px solid var(--card-line); }
.box p { margin: 0; }
.box .compare { font-size: 13.5px; color: var(--sub); }
.box .arrive { font-size: 16px; font-weight: 700; margin-top: 6px; }
.box .arrive.late { color: var(--primary-text); }
.box .fill { font-size: 12.5px; color: var(--hint); margin-top: 6px; }
.banner { border-radius: 14px; padding: 14px 16px; background: var(--info-bg); color: var(--info-text); }
.banner.alert { background: var(--alert-bg); color: var(--alert-text); }
.banner strong { display: block; font-size: 16px; }
.banner span { display: block; font-size: 14px; margin-top: 4px; line-height: 1.5; }
.recap .cap { font-size: 12.5px; font-weight: 700; color: var(--sub); }
.recap .path { font-size: 15px; margin-top: 4px; line-height: 1.55; word-break: keep-all; }
.recap .detail { font-size: 12.5px; color: var(--hint); margin: 6px 0 0; }
.pill { border-radius: 999px; background: var(--card); text-align: center; padding: 14px 16px; font-size: 16px; font-weight: 700; }
.pill.alert { background: var(--alert-bg); color: var(--alert-text); }
.center-text { text-align: center; margin: 0; }
.ratio { font-size: 15px; color: var(--sub); }
.bonus { font-size: 15px; font-weight: 700; color: var(--primary-text); }
.caption { font-size: 16px; font-weight: 700; }

/* 걸은 시간 게이지 */
.ring { width: var(--ring); height: var(--ring); position: relative; margin: 0 auto; flex: 0 0 auto; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9.5; }
.ring .ring-bg { stroke: var(--ring-bg); }
.ring .ring-arc { stroke: var(--accent); transition: stroke-dashoffset .9s cubic-bezier(.2, .7, .2, 1); }
.ring.alert .ring-arc { stroke: var(--primary); }
.ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-big { font-size: calc(var(--ring) * .2); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.ring-small { font-size: 14px; color: var(--sub); margin-top: 10px; }
@media (max-height: 820px) {
  :root { --gap: clamp(11px, 1.8vh, 16px); --ring: min(56vw, 25vh, 230px); --row: clamp(42px, 6vh, 56px); }
  .seg button { min-height: 40px; }
  .field { min-height: 46px; }
  .minutes input { height: 43px; }
  .chips button { min-height: 33px; }
  .screen-body { padding-block: 18px 14px; }
}
.spread { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: space-evenly; gap: var(--gap); }
</style>
</head>
<body>


<div class="app" id="app">
  <!-- 화면 1 · 정보 입력 -->
  <section class="screen" id="screen-input" aria-labelledby="t-input">
    <form class="screen-body" id="form" novalidate>
      <div class="head-group">
        <h1 class="title" id="t-input">산책 경로 추천</h1>
        <p class="subtitle">공강시간에 맞는 경로를 찾아드려요</p>
        <p class="note" id="example-note">예시 값이 들어 있어요. 내 위치와 시간으로 바꿔 보세요.</p>
      </div>
      <div>
        <span class="label" id="l-campus">캠퍼스</span>
        <div class="seg" role="radiogroup" aria-labelledby="l-campus" id="campus"></div>
        <p class="hint" id="campus-info"></p>
      </div>
      <div>
        <label class="label" for="start">현재 위치</label>
        <div class="select-wrap"><select class="field" id="start" required></select></div>
      </div>
      <div>
        <label class="label" for="end">다음 수업 장소</label>

      </div>
      <div>
        <label class="label" for="minutes">다음 수업까지 남은 시간</label>
        <div class="field minutes"><input id="minutes" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" enterkeyhint="go"><span aria-hidden="true">분</span></div>
        <div class="chips" id="chips" aria-label="자주 쓰는 시간"></div>
      </div>
      <div>
        <span class="label" id="l-speed">걸음 속도</span>
        <div class="seg" role="radiogroup" aria-labelledby="l-speed" id="speed"></div>
        <p class="hint">느리게는 소요시간 ×1.2, 빠르게는 ×0.85로 계산해요<br>수업 3분 전에 도착하도록 경로를 찾아요</p>
      </div>
      <p class="foot-note credit">데이터: 팀 수집 72쌍 · 네이버 지도 도보 길찾기(2026년 10월)<br>51조 에비앙보다삼다수 · 문제해결과컴퓨팅사고</p>
      <button type="submit" hidden></button>
    </form>

  <!-- 화면 2 · 경로 추천 -->

      <p class="foot-note" id="route-foot">구간 시간은 반올림한 값이라 모두 더하면 총 시간과 조금 다를 수 있어요.</p>
    </div>
  </section>

  <!-- 화면 3 · 활동 요약 -->
  <section class="screen" id="screen-summary" aria-labelledby="t-summary" hidden>
    <div class="screen-body">
      <div class="head-group">
        <h1 class="title" id="t-summary" tabindex="-1">오늘의 산책</h1>
        <p class="subtitle" id="summary-sub"></p>
      </div>
      <div class="spread" id="summary-content"></div>
    </div>
    <div class="screen-foot">
      <button class="btn" type="button" data-home>홈으로</button>
    </div>

<script>
// engine.js — 파이썬 프로그램의 계산 부분(walk_data.py · route_finder.py · formatting.py)을 그대로 옮긴 것.
// 함수 이름과 순서, 반올림 방식까지 파이썬과 같게 맞췄다. (파이썬 round()는 0.5에서 짝수 쪽으로 반올림한다)
(function (root) {
  'use strict';

  // ---------------------------------------------------------------- route_finder.py의 상수
  const SPEED_OPTIONS = { '느리게': 1.2, '보통': 1.0, '빠르게': 0.85 };
  const SPEED_NAMES = ['느리게', '보통', '빠르게'];
  const DEFAULT_SPEED = '보통';
  const ARRIVAL_MARGIN_MIN = 3;
  const SHORT_SEGMENT_MAX_MIN = 2;
  const MAX_STOPS = 5;
  const MAX_SUGGESTIONS = 5;
  const MIN_EXTRA_MIN = 1;
  const STRIDE_M = 0.7;
  const MAX_REMAINING_MIN = 240;
  const STATUS_WALK = 'walk', STATUS_DIRECT = 'direct', STATUS_LATE = 'late', STATUS_STAY = 'stay';
  const EPS = 1e-9;
  const KIND_BUILDING = '건물-건물', KIND_WAYPOINT = '건물-경유지';

  // 파이썬 round(): 정확히 .5이면 짝수 쪽으로
  function pyRound(x) {
    const f = Math.floor(x);
    const d = x - f;
    if (d > 0.5) return f + 1;
    if (d < 0.5) return f;
    return f % 2 === 0 ? f : f + 1;
  }
  // 파이썬 문자열 비교(코드 포인트 순서) — 장소 이름은 모두 BMP 글자라 UTF-16 비교와 같다
  function cmpStr(a, b) { return a < b ? -1 : (a > b ? 1 : 0); }
  function cmpTuple(a, b) {
    const n = Math.min(a.length, b.length);
    for (let i = 0; i < n; i++) {
      const c = cmpStr(a[i], b[i]);
      if (c) return c;
    }
    return a.length - b.length;
  }

  // ---------------------------------------------------------------- walk_data.py
  class CampusMap {
    constructor(name) {
      this.name = name;
      this.buildings = [];
      this.waypoints = [];
      this.links = new Map();   // links.get(A).get(B) = A→B 구간 (데이터에 나온 순서 유지)
    }
    addSegment(seg) {
      if (!this.links.has(seg.start)) this.links.set(seg.start, new Map());
      this.links.get(seg.start).set(seg.end, seg);
      if (!this.links.has(seg.end)) this.links.set(seg.end, new Map());
      this.links.get(seg.end).set(seg.start, { start: seg.end, end: seg.start, meters: seg.meters, minutes: seg.minutes, kind: seg.kind });
    }
    segment(a, b) { return this.links.get(a).get(b); }
    hasSegment(a, b) { return this.links.has(a) && this.links.get(a).has(b); }
    isWaypoint(place) { return this.waypoints.includes(place); }
  }

  // rows: [캠퍼스, 출발, 도착, 구분, 거리(m), 시간(분)] — CSV와 같은 순서
  function loadCampuses(rows) {
    const campuses = new Map();
    const remember = (items, name) => { if (!items.includes(name)) items.push(name); };
    rows.forEach(([campusName, start, end, kind, meters, minutes]) => {
      if (!campuses.has(campusName)) campuses.set(campusName, new CampusMap(campusName));
      const campus = campuses.get(campusName);
      remember(campus.buildings, start);
      if (kind === KIND_BUILDING) remember(campus.buildings, end); else remember(campus.waypoints, end);
      campus.addSegment({ start, end, meters: Number(meters), minutes: Math.round(Number(minutes)), kind });
    });
    return campuses;
  }

  function averageWalkingSpeed(campuses, minMinutes = 3) {
    let totalMeters = 0, totalMinutes = 0;
    for (const campus of campuses.values()) {
      for (const [a, targets] of campus.links) {
        for (const [b, seg] of targets) {
          if (cmpStr(a, b) < 0 && seg.minutes >= minMinutes) { totalMeters += seg.meters; totalMinutes += seg.minutes; }
        }
      }
    }
    return totalMeters / totalMinutes;
  }

  // ---------------------------------------------------------------- route_finder.py
  function makeRoute(places, segMinutes, segMeters) {
    const total = segMinutes.reduce((s, x) => s + x, 0);
    const meters = segMeters.reduce((s, x) => s + x, 0);
    return {
      places, segmentMinutes: segMinutes, segmentMeters: segMeters,
      totalMinutes: total, totalMeters: meters,
      stops: places.slice(1, -1),
      displayMinutes: Math.max(0, Math.ceil(total - EPS)),
      steps: pyRound(meters / STRIDE_M),
    };
  }

  function segmentMinutes(campus, a, b, baseSpeed, factor) {
    const seg = campus.segment(a, b);
    let minutes;
    if (seg.minutes <= SHORT_SEGMENT_MAX_MIN) minutes = seg.meters / baseSpeed;
    else minutes = seg.minutes;
    return minutes * factor;
  }

  function timeTable(campus, baseSpeed, factor) {
    const table = new Map();
    for (const [a, targets] of campus.links) {
      const row = new Map();
      for (const b of targets.keys()) row.set(b, segmentMinutes(campus, a, b, baseSpeed, factor));
      table.set(a, row);
    }
    return table;
  }

  function buildRoute(campus, places, baseSpeed, factor) {
    const minutes = [], meters = [];
    for (let i = 0; i + 1 < places.length; i++) {
      minutes.push(segmentMinutes(campus, places[i], places[i + 1], baseSpeed, factor));
      meters.push(campus.segment(places[i], places[i + 1]).meters);
    }
    return makeRoute(places, minutes, meters);
  }

  // heapq와 같은 순서로 꺼내는 최소 힙: (시간, 장소 이름) 순으로 비교
  class MinHeap {
    constructor() { this.a = []; }
    less(x, y) { return x[0] < y[0] || (x[0] === y[0] && cmpStr(x[1], y[1]) < 0); }
    push(item) {
      const a = this.a; a.push(item);
      let i = a.length - 1;
      while (i > 0) { const p = (i - 1) >> 1; if (!this.less(a[i], a[p])) break; [a[i], a[p]] = [a[p], a[i]]; i = p; }
    }
    pop() {
      const a = this.a; const top = a[0]; const last = a.pop();
      if (a.length) {
        a[0] = last; let i = 0;
        for (;;) {
          const l = 2 * i + 1, r = l + 1; let m = i;
          if (l < a.length && this.less(a[l], a[m])) m = l;
          if (r < a.length && this.less(a[r], a[m])) m = r;
          if (m === i) break;
          [a[i], a[m]] = [a[m], a[i]]; i = m;
        }
      }
      return top;
    }
    get size() { return this.a.length; }
  }

  // 다익스트라 알고리즘
  function findFastestRoute(campus, start, end, baseSpeed, factor) {
    if (start === end) return makeRoute([start], [], []);
    const table = timeTable(campus, baseSpeed, factor);
    const best = new Map([[start, 0]]);
    const previous = new Map();
    const queue = new MinHeap(); queue.push([0, start]);
    const done = new Set();
    while (queue.size) {
      const [elapsed, place] = queue.pop();
      if (done.has(place)) continue;
      done.add(place);
      if (place === end) break;
      const row = table.get(place) || new Map();
      for (const [nxt, minutes] of row) {
        const t = elapsed + minutes;
        if (t < (best.has(nxt) ? best.get(nxt) : Infinity) - EPS) {
          best.set(nxt, t); previous.set(nxt, place); queue.push([t, nxt]);
        }
      }
    }
    if (!best.has(end)) throw new Error(`${start}에서 ${end}(으)로 가는 길이 데이터에 없습니다.`);
    const places = [end];
    while (places[places.length - 1] !== start) places.push(previous.get(places[places.length - 1]));
    places.reverse();
    return buildRoute(campus, places, baseSpeed, factor);
  }

  // 깊이 우선 탐색 + 가지치기
  function findCandidateRoutes(campus, start, end, walkLimit, baseSpeed, factor, maxStops = MAX_STOPS) {
    const table = timeTable(campus, baseSpeed, factor);
    const found = [];
    const path = [start];
    const times = [];
    const visited = new Set([start]);
    let explored = 0;
    function dfs(current, elapsed) {
      const row = table.get(current) || new Map();
      for (const [nxt, t] of row) {
        explored += 1;
        if (elapsed + t > walkLimit + EPS) continue;               // 가지치기: 이미 시간 초과
        if (nxt === end) {
          if (start !== end || path.length >= 2) {                  // 제자리면 최소 한 곳은 들러야 함
            const all = path.concat([end]);
            const meters = [];
            for (let i = 0; i + 1 < all.length; i++) meters.push(campus.segment(all[i], all[i + 1]).meters);
            found.push(makeRoute(all, times.concat([t]), meters));
          }
          continue;
        }
        if (visited.has(nxt) || path.length - 1 >= maxStops) continue;
        visited.add(nxt); path.push(nxt); times.push(t);
        dfs(nxt, elapsed + t);
        times.pop(); path.pop(); visited.delete(nxt);              // 되돌아오기(백트래킹)
      }
    }
    if (walkLimit > 0) dfs(start, 0);
    return { routes: found, explored };
  }

  function findShortestLoop(campus, start, baseSpeed, factor) {
    const table = timeTable(campus, baseSpeed, factor);
    let bound = Infinity;
    for (const n of (table.get(start) || new Map()).keys()) {
      const t = table.get(start).get(n) + table.get(n).get(start);
      if (t >= MIN_EXTRA_MIN - EPS && t < bound) bound = t;
    }
    if (bound === Infinity) bound = MAX_REMAINING_MIN;
    const loops = findCandidateRoutes(campus, start, start, bound, baseSpeed, factor).routes;
    let best = null;
    for (const r of loops) {
      if (r.totalMinutes < MIN_EXTRA_MIN - EPS) continue;
      if (best === null || r.totalMinutes < best.totalMinutes ||
          (r.totalMinutes === best.totalMinutes && (r.stops.length < best.stops.length ||
            (r.stops.length === best.stops.length && cmpTuple(r.places, best.places) < 0)))) best = r;
    }
    return best;
  }

  // 순위: 오래 걷는 순 → 들르는 곳이 적은 순 → 거리가 긴 순 → 이름순
  function routeSortCompare(x, y) {
    if (x.displayMinutes !== y.displayMinutes) return y.displayMinutes - x.displayMinutes;
    if (x.stops.length !== y.stops.length) return x.stops.length - y.stops.length;
    if (x.totalMeters !== y.totalMeters) return y.totalMeters - x.totalMeters;
    return cmpTuple(x.places, y.places);
  }

  function rankRoutes(candidates, fastest, maxSuggestions = MAX_SUGGESTIONS) {
    const threshold = fastest.totalMinutes + MIN_EXTRA_MIN;
    const walks = candidates.filter((r) => r.totalMinutes >= threshold - EPS).sort(routeSortCompare);
    const picked = [], seen = new Set();
    for (const route of walks) {
      const key = route.stops.slice().sort(cmpStr).join('\u0000');
      if (seen.has(key)) continue;
      seen.add(key); picked.push(route);
      if (picked.length >= maxSuggestions) break;
    }
    return { routes: picked, walkCount: walks.length, comboCount: seen.size };
  }

  function recommend(campus, start, end, remainingMinutes, speed, baseSpeed, departure) {

  const $ = (id) => document.getElementById(id);
  // '체육관(72동)'처럼 괄호가 붙은 이름이 줄 끝에서 갈라지지 않게 괄호 앞뒤에 줄바꿈 금지 문자(U+2060)를 넣는다
  const keep = (s) => String(s).replace(/([가-힣A-Za-z0-9])\(/g, '$1\u2060(').replace(/\)(?=[가-힣])/g, ')\u2060');
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = keep(text); return n; };

  const state = { campus: [...campuses.keys()][0], speed: E.DEFAULT_SPEED, rec: null, index: 0 };

  // ---------------------------------------------------------------- 화면 1
  function buildSeg(container, options, current, onPick) {
    container.innerHTML = '';
    options.forEach((name) => {
      const b = el('button', null, name);
      b.type = 'button'; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', String(name === current));
      b.addEventListener('click', () => onPick(name));
      container.appendChild(b);
    });
  }
  function fillSelect(select, items, placeholder, keep) {
    const prev = keep ? select.value : '';
    select.innerHTML = '';
    const ph = el('option', null, placeholder); ph.value = ''; ph.disabled = true; select.appendChild(ph);
    items.forEach((name) => { const o = el('option', null, name); o.value = name; select.appendChild(o); });
    select.value = items.includes(prev) ? prev : '';
  }
  function setCampus(name, keep) {
    state.campus = name;
    const campus = campuses.get(name);
    buildSeg($('campus'), [...campuses.keys()], name, (n) => { if (n !== state.campus) { touched(); setCampus(n, true); } });
    $('campus-info').textContent = `건물 ${campus.buildings.length}곳 · 경유지 ${campus.waypoints.length}곳(${campus.waypoints.join(', ')})`;
    fillSelect($('start'), campus.buildings, '건물을 고르세요', keep);
    fillSelect($('end'), campus.buildings, '건물을 고르세요', keep);
    $('error').textContent = '';
  }
  function setSpeed(name) {
    state.speed = name;
    buildSeg($('speed'), E.SPEED_NAMES, name, (n) => { touched(); setSpeed(n); });
  }
  function syncChips() {
    const v = $('minutes').value;
    $('chips').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  }
  function touched() { $('example-note').hidden = true; }

  PRESETS.forEach((m) => {
    const b = el('button', null, `${m}분`); b.type = 'button'; b.dataset.v = String(m);
    b.addEventListener('click', () => { touched(); $('minutes').value = String(m); syncChips(); $('error').textContent = ''; });
    $('chips').appendChild(b);
  });
  $('minutes').addEventListener('input', (e) => {
    const digits = e.target.value.replace(/[^0-9]/g, '').slice(0, 3);
    if (digits !== e.target.value) e.target.value = digits;
    touched(); syncChips(); $('error').textContent = '';
  });
  ['start', 'end'].forEach((id) => $(id).addEventListener('change', () => { touched(); $('error').textContent = ''; }));

  function submit() {
    const start = $('start').value, end = $('end').value, text = $('minutes').value.trim();
    const err = $('error');
    if (!start) { err.textContent = '현재 위치를 골라 주세요.'; $('start').focus(); return; }
    if (!end) { err.textContent = '다음 수업 장소를 골라 주세요.'; $('end').focus(); return; }
    if (!/^[0-9]+$/.test(text)) { err.textContent = '다음 수업까지 남은 시간을 분 단위 숫자로 입력해 주세요.'; $('minutes').focus(); return; }
    const minutes = parseInt(text, 10);
    if (minutes < 1 || minutes > E.MAX_REMAINING_MIN) { err.textContent = `남은 시간은 1~${E.MAX_REMAINING_MIN}분 사이로 입력해 주세요.`; $('minutes').focus(); return; }
    err.textContent = '';
    const btn = $('find');
    btn.disabled = true; btn.textContent = '경로 찾는 중…';
    // 화면이 '찾는 중'을 먼저 그린 뒤 계산한다 (긴 공강은 휴대폰에서 1초 가까이 걸릴 수 있다)
    setTimeout(() => {
      try {
        state.rec = E.recommend(campuses.get(state.campus), start, end, minutes, state.speed, baseSpeed, new Date());
        state.index = 0;
        renderRoute();
        show('screen-route');
        fitAll();
      } finally {
        btn.disabled = false; btn.textContent = '경로 찾기';
      }
    }, 30);
  }
  $('form').addEventListener('submit', (e) => { e.preventDefault(); submit(); });
  $('find').addEventListener('click', submit);

  // ---------------------------------------------------------------- 공통 부품
  function ring(minutes, small, ratio, alert, label) {
    const wrap = el('div', 'ring' + (alert ? ' alert' : ''));
    wrap.setAttribute('role', 'img'); wrap.setAttribute('aria-label', label);
    const C = 2 * Math.PI * 52;
    wrap.innerHTML = `<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="ring-bg" cx="60" cy="60" r="52"></circle><circle class="ring-arc" cx="60" cy="60" r="52" stroke-linecap="${ratio >= 0.999 ? 'butt' : 'round'}" stroke-dasharray="${C}" stroke-dashoffset="${C}"></circle></svg>`;
    const t = el('div', 'ring-text'); t.setAttribute('aria-hidden', 'true');
    t.appendChild(el('div', 'ring-big', `${minutes}분`)); t.appendChild(el('div', 'ring-small', small));
    wrap.appendChild(t);
    const arc = wrap.querySelector('.ring-arc');
    const target = C * (1 - Math.max(0, Math.min(1, ratio)));
    requestAnimationFrame(() => requestAnimationFrame(() => { arc.style.strokeDashoffset = String(target); }));
    return wrap;
  }
  // 한 줄에 들어가면 ' · '로 잇고, 넘치면 조각마다 줄을 바꾼다 (PC 버전의 fit_join과 같은 규칙)
  function fitParts(p) {
    const parts = JSON.parse(p.dataset.parts);
    p.textContent = keep(parts.join(' · '));
    const cs = getComputedStyle(p);
    let lh = parseFloat(cs.lineHeight);
    if (!lh) lh = parseFloat(cs.fontSize) * 1.45;
    if (p.getBoundingClientRect().height > lh * 1.5) {
      p.textContent = '';
      parts.forEach((t, i) => { if (i) p.appendChild(document.createElement('br')); p.appendChild(document.createTextNode(keep(t))); });
    }
  }
  function fitAll() { document.querySelectorAll('.screen:not([hidden]) [data-parts]').forEach(fitParts); }
  window.addEventListener('resize', fitAll);
  function partsLine(cls, parts) { const p = el('p', cls, parts.join(' · ')); p.dataset.parts = JSON.stringify(parts); return p; }
  function stats(items) {
    const g = el('div', 'stats');
    items.forEach(([label, value]) => { const c = el('div', 'stat'); c.appendChild(el('div', 'stat-label', label)); c.appendChild(el('div', 'stat-value', value)); g.appendChild(c); });
    return g;
  }
  function banner(title, detail, alert) {
    const b = el('div', 'banner' + (alert ? ' alert' : ''));
    b.appendChild(el('strong', null, title)); b.appendChild(el('span', null, detail));
    return b;
  }
  function timeline(route, campus) {
    const ol = el('ol', 'timeline' + (route.places.length >= 6 ? ' many' : ''));
    ol.setAttribute('aria-label', '걷는 순서');
    const last = route.places.length - 1;
    route.places.forEach((place, i) => {
      const li = el('li', 'tl-row' + (i === 0 || i === last ? ' edge' : '') + (i === last ? ' last' : ''));
      li.appendChild(el('span', 'tl-dot'));
      const name = el('span', 'tl-name', place);
      if (campus.isWaypoint(place)) name.appendChild(el('span', 'tl-tag', '경유지'));
      li.appendChild(name);
      li.appendChild(el('span', 'tl-time', i === 0 ? '출발' : E.fmtSegmentMinutes(route.segmentMinutes[i - 1])));
      ol.appendChild(li);
    });
    return ol;
  }

  // ---------------------------------------------------------------- 화면 2
  function renderRoute() {
    const rec = state.rec, route = E.routeAt(rec, state.index), campus = campuses.get(rec.campus);
    $('route-heading').textContent = keep(E.routeHeading(rec));
    const box = $('route-content'); box.innerHTML = '';
    const [title, detail] = E.statusBanner(rec);
    if (title) box.appendChild(banner(title, detail, rec.status === E.STATUS_LATE));

    const primary = $('primary'), next = $('next');
    if (rec.status === E.STATUS_STAY) {
      primary.textContent = '처음으로';
      next.hidden = true;
      $('route-foot').textContent = '';
      $('route-foot').hidden = true;
      const need = E.loopNeededMinutes(rec);
      if (need !== null) {
        box.appendChild(ring(rec.remainingMinutes, '남은 시간', rec.remainingMinutes / need, false, `남은 시간 ${rec.remainingMinutes}분, 한 바퀴에 ${need}분 필요`));
        box.appendChild(el('p', 'center-text caption', E.loopNeedLine(rec)));
        const p = el('div', 'box recap');
        p.appendChild(el('div', 'cap', '가장 짧은 한 바퀴'));
        p.appendChild(el('div', 'path', rec.shortestLoop.places.join(' → ')));
        p.appendChild(partsLine('detail', E.loopDetailParts(rec)));
        box.appendChild(p);
      }
      return;
    }
    primary.textContent = rec.status === E.STATUS_WALK ? '이 경로로 시작하기' : '이 길로 바로 이동하기';
    $('route-foot').hidden = false;
    $('route-foot').textContent = FOOTNOTE;
    if (rec.routes.length > 1) {
      next.hidden = false;
      $('next-count').textContent = `${(state.index % rec.routes.length) + 1} / ${rec.routes.length}`;
    } else next.hidden = true;

    box.appendChild(timeline(route, campus));
    box.appendChild(stats([['예상 이동시간', `${route.displayMinutes}분`], ['예상 거리', E.fmtDistance(route.totalMeters)]]));
    const info = el('div', 'box');
    info.appendChild(partsLine('compare', E.compareParts(rec, route)));
    info.appendChild(el('p', 'arrive' + (rec.status === E.STATUS_LATE ? ' late' : ''), E.arrivalLine(rec, route)));
    const fill = E.fillNote(rec, route);
    if (fill) info.appendChild(el('p', 'fill', fill));
    box.appendChild(info);
  }
  $('primary').addEventListener('click', () => {
    if (!state.rec) return;
    if (state.rec.status === E.STATUS_STAY) { goHome(); return; }
    renderSummary(); show('screen-summary');
  });
  $('next').addEventListener('click', () => {
    if (!state.rec || state.rec.routes.length < 2) return;
    state.index = (state.index + 1) % state.rec.routes.length;
    renderRoute();
    fitAll();
    $('route-body').scrollTop = 0;
  });

  // ---------------------------------------------------------------- 화면 3
  function renderSummary() {
    const rec = state.rec, route = E.routeAt(rec, state.index);
    const late = rec.status === E.STATUS_LATE;
    $('summary-sub').textContent = rec.status === E.STATUS_WALK ? '공강시간을 걷기로 채웠어요' : '가장 빠른 길로 이동했어요';
    const box = $('summary-content'); box.innerHTML = '';
    const minutes = route.displayMinutes;
    const ratio = rec.remainingMinutes ? minutes / rec.remainingMinutes : 0;
    box.appendChild(ring(minutes, '걸은 시간', ratio, late, `걸은 시간 ${minutes}분`));
    box.appendChild(el('p', 'center-text ratio', E.summaryRatioLine(rec, route)));
    box.appendChild(stats([['이동 거리', E.fmtDistance(route.totalMeters)], ['걸음 수(약)', E.fmtSteps(route.steps)]]));
    box.appendChild(el('div', 'pill' + (late ? ' alert' : ''), E.arrivalLine(rec, route)));
    const recap = el('div', 'box recap');
    recap.appendChild(el('div', 'cap', '걸은 경로'));
    recap.appendChild(el('div', 'path', route.places.join(' → ')));
    box.appendChild(recap);
    const bonus = E.summaryBonusLine(rec, route);
    if (bonus) box.appendChild(el('p', 'center-text bonus', bonus));
  }

  // ---------------------------------------------------------------- 화면 전환
  function show(id) {
    ['screen-input', 'screen-route', 'screen-summary'].forEach((s) => { $(s).hidden = s !== id; });
    const scr = $(id);
    scr.classList.remove('enter'); void scr.offsetWidth; scr.classList.add('enter');
    const body = scr.querySelector('.screen-body'); if (body) body.scrollTop = 0;
    const h = scr.querySelector('h1'); if (h && id !== 'screen-input') h.focus({ preventScroll: true });
  }
  function goHome() { show('screen-input'); }
  document.querySelectorAll('[data-home]').forEach((b) => b.addEventListener('click', goHome));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('screen-input').hidden) goHome(); });

  // ---------------------------------------------------------------- 처음 화면: 예시 값으로 채워 둔다
  setCampus(state.campus, false);
  setSpeed(state.speed);
  $('start').value = '신관A동';
  $('end').value = '체육관(72동)';
  $('minutes').value = '30';
  syncChips();
})();
</script>

</body>
</html>
